name: Daily Moving Countdown Text

on:
  workflow_dispatch:       # run manually anytime from the Actions tab

jobs:
  send-text:
    runs-on: ubuntu-latest
    steps:
      - name: Send countdown text to both phones
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:  ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUM:    ${{ secrets.TWILIO_FROM_NUM }}
          TWILIO_TO_NUMS:     ${{ secrets.TWILIO_TO_NUMS }}
        run: |
          python3 << 'EOF'
          import urllib.request, urllib.parse, base64, os
          from datetime import date

          ACCOUNT_SID = os.environ["TWILIO_ACCOUNT_SID"]
          AUTH_TOKEN  = os.environ["TWILIO_AUTH_TOKEN"]
          FROM_NUM    = os.environ["TWILIO_FROM_NUM"]
          TO_NUMS     = os.environ["TWILIO_TO_NUMS"].split(",")

          today     = date.today()
          move_day  = date(2026, 6, 26)   # movers arrive, move into Pine Bluff
          final_out = date(2026, 6, 27)   # out of Springwater by noon

          days_to_move = (move_day - today).days

          # multiple options per tier — rotate by day of year so it's fresh each time
          def pick(options):
              return options[today.toordinal() % len(options)]

          if today < move_day:
              d = days_to_move
              if d > 30:
                  msg = pick([
                      f"📦 {d} days until move day (June 26). Plenty of runway! ...but maybe tackle that one junk drawer.",
                      f"🏠 {d} days to go. Pine Bluff is out there waiting. It doesn't know how lucky it is.",
                      f"📋 {d} days until move day. Future you will be SO grateful present you started packing early.",
                  ])
              elif d > 21:
                  msg = pick([
                      f"📦 {d} days to move day. The boxes aren't going to pack themselves. (We checked.)",
                      f"🛻 {d} days left. Start with the stuff you never use. You know the room.",
                      f"📦 {d} days. Donate pile. Trash pile. Keep pile. Go.",
                  ])
              elif d > 14:
                  msg = pick([
                      f"😬 {d} days until June 26. Time to stop pretending this isn't happening.",
                      f"⏳ {d} days. Every box you pack today is one less panic on move day.",
                      f"📅 {d} days out. Every drawer you clear now is a gift to future you.",
                  ])
              elif d == 14:
                  msg = ("📅 TWO WEEKS. 14 days to move day. "
                         "You're still sleeping in your house — but it's time to pack like you're not.")
              elif d > 7:
                  msg = pick([
                      f"🚨 {d} days to move day. Movers booked ✓ Utilities set ✓ Mildly panicking ✓ Good.",
                      f"⚡ {d} days. Pack like your future self is watching. (They are. They're grateful.)",
                      f"🔥 {d} days left. If it's not labeled it doesn't exist. Label everything.",
                  ])
              elif d == 7:
                  msg = ("🗓️ ONE WEEK. 7 days until move day. "
                         "If it's not packed by now it's getting donated. We don't make the rules.")
              elif d > 3:
                  msg = pick([
                      f"🔥 {d} DAYS. Boxes everywhere is the vibe right now. Every box = one less crisis on June 26.",
                      f"😤 {d} days. Essentials bag packed? Documents gathered? Fridge defrosted? GO.",
                      f"⏰ {d} days left. Home stretch. Pack fast, label everything, breathe.",
                  ])
              elif d == 3:
                  msg = ("⏰ 3 days to move day. Finish packing. Defrost the fridge. "
                         "Find the passports. You've got this (you're fine, totally fine). "
                         "June 26 is almost here — Pine Bluff is waiting. 🏡")
              elif d == 2:
                  msg = ("😰 2 days to move day! Movers arrive June 26. "
                         "Get that essentials bag ready. Get some sleep. You're almost through it.")
              elif d == 1:
                  msg = ("🚨 TOMORROW IS MOVE DAY!! Set 3 alarms. Eat a real breakfast. "
                         "Movers arrive June 26 — by tonight you'll be sleeping at Pine Bluff. "
                         "LET'S GO!! 💪🏡")
              else:
                  msg = ("🚛🏡 TODAY IS JUNE 26 — MOVE DAY!! "
                         "Movers are coming. Load it up. Drive to Pine Bluff. Unload. "
                         "By tonight, 10878 Pine Bluff Dr is HOME. "
                         "YOU DID IT. GO GO GO!! 🔑🎉")

          elif today == final_out:
              msg = ("⏰ TODAY IS JUNE 27 — LAST DAY AT SPRINGWATER. OUT BY NOON!! "
                     "Final sweep, final photos, hand over those keys. "
                     "Then head HOME to Pine Bluff — you already live there now. 🏡"
                     "Close the chapter. Start the next one. It's going to be amazing. 🎊")

          else:
              d = (today - final_out).days
              msg = pick([
                  f"🏡 Day {d} at Pine Bluff! Hope it's starting to feel like home 🎉",
                  f"🏠 {d} days in the new place! Every box you unpack makes it more yours. Keep going!",
                  f"✨ {d} days at Pine Bluff! Remember to change the locks if you haven't. And enjoy it — you EARNED this! 🎉",
              ])

          url = (f"https://api.twilio.com/2010-04-01/Accounts/"
                 f"{ACCOUNT_SID}/Messages.json")
          creds = base64.b64encode(f"{ACCOUNT_SID}:{AUTH_TOKEN}".encode()).decode()

          for num in TO_NUMS:
              data = urllib.parse.urlencode({
                  "To": num, "From": FROM_NUM, "Body": msg
              }).encode()
              req = urllib.request.Request(url, data=data)
              req.add_header("Authorization", f"Basic {creds}")
              with urllib.request.urlopen(req) as resp:
                  print(f"✓ Sent to {num} — HTTP {resp.status}")

          print(f"\nMessage:\n{msg}")
          EOF
