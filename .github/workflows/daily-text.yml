name: Daily Moving Countdown Text

on:
  schedule:
    - cron: '0 14 * * *'  # 10:00 AM EDT (UTC-4)
  workflow_dispatch:       # run manually anytime from the Actions tab

jobs:
  send-text:
    runs-on: ubuntu-latest
    steps:
      - name: Send countdown text to both phones
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:  ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUM:    ${{ secrets.TWILIO_FROM_NUM }}
          TWILIO_TO_NUMS:     ${{ secrets.TWILIO_TO_NUMS }}
        run: |
          python3 << 'EOF'
          import urllib.request, urllib.parse, base64, os
          from datetime import date

          ACCOUNT_SID = os.environ["TWILIO_ACCOUNT_SID"]
          AUTH_TOKEN  = os.environ["TWILIO_AUTH_TOKEN"]
          FROM_NUM    = os.environ["TWILIO_FROM_NUM"]
          TO_NUMS     = os.environ["TWILIO_TO_NUMS"].split(",")

          today    = date.today()
          move_out = date(2026, 6, 15)
          move_in  = date(2026, 6, 22)

          days_to_out = (move_out - today).days
          days_to_in  = (move_in  - today).days

          # multiple options per tier — rotate by day of year so it's fresh each time
          def pick(options):
              return options[today.toordinal() % len(options)]

          if today < move_out:
              d = days_to_out
              if d > 30:
                  msg = pick([
                      f"📦 {d} days until June 15 move-out. Plenty of runway! ...but maybe tackle that one junk drawer.",
                      f"🏠 {d} days to go. The new house is out there waiting. It doesn't know how lucky it is.",
                      f"📋 {d} days until move-out. Future you will be SO grateful present you started packing early.",
                  ])
              elif d > 21:
                  msg = pick([
                      f"📦 {d} days to move-out. The boxes aren't going to pack themselves. (We checked.)",
                      f"🛻 {d} days left. Start with the stuff you never use. You know the room.",
                      f"📦 {d} days. Donate pile. Trash pile. Keep pile. Go.",
                  ])
              elif d > 14:
                  msg = pick([
                      f"😬 {d} days until June 15. Time to stop pretending this isn't happening.",
                      f"⏳ {d} days. Every box you pack today is one less panic on moving day.",
                      f"📅 {d} days out. The POD should be filling up. How's it looking in there?",
                  ])
              elif d == 14:
                  msg = ("📅 TWO WEEKS. 14 days to move-out. "
                         "This is the part where things get real. Deep breath. Then pack.")
              elif d > 7:
                  msg = pick([
                      f"🚨 {d} days to move-out. POD ordered ✓ Housing booked ✓ Mildly panicking ✓ Good.",
                      f"⚡ {d} days. Pack like your future self is watching. (They are. They're grateful.)",
                      f"🔥 {d} days left. If it's not labeled it doesn't exist. Label everything.",
                  ])
              elif d == 7:
                  msg = ("🗓️ ONE WEEK. 7 days. "
                         "If it's not packed by now it's getting donated. We don't make the rules.")
              elif d > 3:
                  msg = pick([
                      f"🔥 {d} DAYS. The POD better be nearly full. Every box now = one less crisis later.",
                      f"😤 {d} days. Essentials bag packed? Documents gathered? Fridge defrosted? GO.",
                      f"⏰ {d} days left. You're in the home stretch. Pack fast, label everything, breathe.",
                  ])
              elif d == 3:
                  msg = ("⏰ 3 days. Finish packing. Defrost the fridge. "
                         "Find the passports. You've got this (you're fine, totally fine).")
              elif d == 2:
                  msg = ("😰 2 days to move-out. "
                         "Last full day tomorrow. Lock the POD. Get some sleep. You're almost through it.")
              elif d == 1:
                  msg = ("🚨 TOMORROW IS MOVE-OUT DAY. Set 3 alarms. Eat a real breakfast. "
                         "Hand over those keys like the legends you are. June 22 is only 8 days away! 💪")
              else:
                  msg = ("🚛 TODAY IS JUNE 15 — MOVE-OUT DAY!! "
                         "Hand over the keys. Lock the POD. You did it. "
                         "Next stop: YOUR NEW HOME in 7 days. GO GO GO!!")

          elif today < move_in:
              gap_day = (today - move_out).days + 1
              d = days_to_in
              gap_msgs = {
                  1: ("🏚️ Day 1 of 7: officially, temporarily, intentionally homeless. "
                      "Keys handed over like a boss. Hotel life begins. "
                      "June 22 is 7 days away — the countdown is ON. 🔑"),
                  2: ("🛎️ Homeless life, day 2. "
                      "Breakfast buffet hits different when it's not your kitchen. "
                      "6 days until you get your new front door. Hang tight!"),
                  3: ("🧳 Day 3 of the great nomad era. "
                      "You're basically explorers now. Brave ones. "
                      "5 days until June 22 — the new house is just sitting there, waiting for you. 🏡"),
                  4: ("📦 Day 4! More than halfway through the gap. "
                      "The POD is packed, the new house is ready, and you're nearly there. "
                      "4 more days. Start getting excited!! 🎉"),
                  5: ("🔥 Day 5 — only 3 more sleeps!! "
                      "Think about where the couch goes. Think about that first meal in the new kitchen. "
                      "It's almost time. June 22 is SO CLOSE. 🏠"),
                  6: ("✨ Day 6. TWO MORE SLEEPS. "
                      "Tomorrow is move-in eve. The night before the keys. "
                      "Get excited — like, genuinely, this-is-happening excited. 🔑🏡"),
                  7: ("🎊 Day 7 — TOMORROW IS JUNE 22!! "
                      "Move-in day is HERE. Get a great night's sleep. "
                      "Tomorrow you walk into YOUR new home for the first time as owners. "
                      "IT'S HAPPENING!! 🏡🎉🔑"),
              }
              msg = gap_msgs.get(gap_day,
                  f"🏕️ Homeless life, day {gap_day}. {d} days to go. Almost there!")

              if d == 0:
                  msg = ("🏡🎉 TODAY IS JUNE 22 — MOVE-IN DAY!!! "
                         "Go. Get. Those. Keys. "
                         "New address. New chapter. New memories. Same legendary family. "
                         "We are SO proud of you — LET'S GOOOOO!! 🔑🎊🏠🎉")

          else:
              d = (today - move_in).days
              msg = pick([
                  f"🏡 Day {d} in the new house! Hope it's starting to feel like yours 🎉",
                  f"🏠 {d} days in! Every box you unpack makes it more home. Keep going!",
                  f"✨ {d} days in the new place! Remember to change the locks if you haven't. And enjoy it — you earned this! 🎉",
              ])

          url = (f"https://api.twilio.com/2010-04-01/Accounts/"
                 f"{ACCOUNT_SID}/Messages.json")
          creds = base64.b64encode(f"{ACCOUNT_SID}:{AUTH_TOKEN}".encode()).decode()

          for num in TO_NUMS:
              data = urllib.parse.urlencode({
                  "To": num, "From": FROM_NUM, "Body": msg
              }).encode()
              req = urllib.request.Request(url, data=data)
              req.add_header("Authorization", f"Basic {creds}")
              with urllib.request.urlopen(req) as resp:
                  print(f"✓ Sent to {num} — HTTP {resp.status}")

          print(f"\nMessage:\n{msg}")
          EOF
