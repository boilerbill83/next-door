<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏡 The Big Move — June 2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f2ee;
    --white: #ffffff;
    --ink: #181520;
    --ink-mid: #5a5468;
    --ink-faint: #b0aab8;
    --rule: rgba(24,21,32,0.08);

    --c1: #6d28d9;   /* pre-move  — violet */
    --c2: #be123c;   /* move out  — crimson */
    --c3: #0369a1;   /* the gap   — sapphire */
    --c4: #047857;   /* move in   — emerald */
    --c5: #b45309;   /* settle in — amber */

    --imp-must:   #dc2626;
    --imp-high:   #ea580c;
    --imp-medium: #4f46e5;
    --imp-low:    #94a3b8;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ─── HERO ─── */
  .hero {
    position: relative;
    height: 560px;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
  }

  .hero-img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 55%;
    filter: brightness(0.55) saturate(1.15);
    transition: transform 10s ease;
  }

  .hero:hover .hero-img { transform: scale(1.04); }

  .hero-overlay {
    position: absolute; inset: 0;
    background:
      linear-gradient(to top, rgba(10,6,18,0.96) 0%, rgba(10,6,18,0.5) 45%, transparent 100%);
  }

  /* diagonal texture stripe */
  .hero-overlay::after {
    content: '';
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(
      -45deg,
      transparent,
      transparent 3px,
      rgba(255,255,255,0.012) 3px,
      rgba(255,255,255,0.012) 4px
    );
  }

  .hero-content {
    position: relative; z-index: 2;
    padding: 0 52px 52px;
    width: 100%;
  }

  .hero-kicker {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    margin-bottom: 14px;
  }

  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(44px, 7vw, 80px);
    font-weight: 900;
    color: #fff;
    line-height: 0.97;
    margin-bottom: 18px;
    letter-spacing: -0.02em;
  }

  .hero-title em {
    font-style: italic;
    font-weight: 700;
    color: transparent;
    -webkit-text-stroke: 1.5px rgba(255,255,255,0.6);
  }

  .hero-chips {
    display: flex; gap: 10px; flex-wrap: wrap;
    margin-top: 24px;
  }

  .hero-chip {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 16px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 100px;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(10px);
    font-size: 13px; color: #fff; font-weight: 500;
  }

  .hero-chip-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #fff;
    opacity: 0.5;
  }

  /* ─── STICKY NAV ─── */
  .nav {
    position: sticky; top: 0; z-index: 200;
    background: var(--ink);
    padding: 0 52px;
    display: flex; align-items: stretch;
    height: 52px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  }

  .nav-progress {
    flex: 1;
    display: flex; align-items: center; gap: 14px;
  }

  .nav-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    white-space: nowrap;
  }

  .nav-track {
    flex: 1; height: 3px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    overflow: visible;
    position: relative;
  }

  .nav-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--c1), var(--c3), var(--c4));
    border-radius: 2px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    width: 0%;
  }

  .nav-count {
    font-family: 'Playfair Display', serif;
    font-size: 18px; font-weight: 700;
    color: #fff;
    white-space: nowrap;
  }

  .nav-emoji {
    font-size: 18px;
    transition: all 0.3s;
  }

  /* ─── MAIN ─── */
  .main {
    max-width: 860px;
    margin: 0 auto;
    padding: 64px 24px 120px;
  }

  /* ─── PHASE ─── */
  .phase { margin-bottom: 72px; }

  .phase-head {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 0;
    margin-bottom: 24px;
  }

  .phase-num {
    font-family: 'Playfair Display', serif;
    font-size: 72px;
    font-weight: 900;
    line-height: 1;
    color: var(--rule);
    margin-right: 18px;
    letter-spacing: -0.04em;
    user-select: none;
    transition: color 0.3s;
  }

  .phase:hover .phase-num { color: rgba(24,21,32,0.12); }

  .phase-info {}

  .phase-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px; font-weight: 700;
    color: var(--ink);
    line-height: 1.15;
  }

  .phase-sub {
    font-family: 'DM Mono', monospace;
    font-size: 10px; letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-top: 3px;
  }

  .phase-tally {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--ink-faint);
    text-align: right;
    white-space: nowrap;
    padding-left: 16px;
  }

  .phase-tally strong {
    font-size: 20px;
    font-weight: 500;
    color: var(--ink-mid);
    display: block;
    line-height: 1;
  }

  /* colored rule under phase head */
  .phase-rule {
    height: 2px;
    border-radius: 1px;
    margin-bottom: 16px;
    background: var(--rule);
    position: relative;
    overflow: hidden;
  }

  .phase-rule::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: 1px;
    background: var(--phase-color, var(--rule));
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
  }

  .phase-rule.active::after { transform: scaleX(1); }

  /* ─── TASKS ─── */
  .task-list { display: flex; flex-direction: column; gap: 3px; }

  .task {
    display: grid;
    grid-template-columns: 28px 1fr;
    gap: 14px;
    padding: 13px 16px 13px 16px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.12s, box-shadow 0.12s, transform 0.12s;
    background: var(--white);
    border-left: 3px solid transparent;
    position: relative;
  }

  /* importance → left border color */
  .task[data-imp="critical"] { border-left-color: var(--imp-must); }
  .task[data-imp="high"]     { border-left-color: var(--imp-high); }
  .task[data-imp="medium"]   { border-left-color: var(--imp-medium); }
  .task[data-imp="low"]      { border-left-color: var(--ink-faint); }

  .task:hover {
    background: #fff;
    box-shadow: 0 4px 20px rgba(24,21,32,0.10);
    transform: translateX(3px);
  }

  .task.checked {
    background: rgba(24,21,32,0.03);
    border-left-color: var(--rule) !important;
  }

  .task.checked:hover {
    box-shadow: none;
    transform: none;
  }

  /* checkbox */
  .cb {
    width: 20px; height: 20px;
    border-radius: 5px;
    border: 1.5px solid var(--rule);
    background: #fff;
    flex-shrink: 0;
    margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.18s cubic-bezier(0.4,0,0.2,1);
  }

  .task.checked .cb {
    background: var(--ink);
    border-color: var(--ink);
  }

  .cb::after {
    content: '';
    width: 10px; height: 6px;
    border-left: 2px solid #fff;
    border-bottom: 2px solid #fff;
    transform: rotate(-45deg) translate(0, -1px) scale(0);
    transition: transform 0.18s cubic-bezier(0.4,0,0.2,1);
  }

  .task.checked .cb::after { transform: rotate(-45deg) translate(0,-1px) scale(1); }

  /* body */
  .task-body { min-width: 0; }

  .task-text {
    font-size: 14px; font-weight: 500;
    color: var(--ink);
    line-height: 1.45;
    transition: color 0.15s;
  }

  .task.checked .task-text {
    text-decoration: line-through;
    color: var(--ink-faint);
    font-weight: 400;
  }

  .task-note {
    font-size: 12px;
    color: var(--ink-faint);
    margin-top: 3px;
    line-height: 1.45;
    font-weight: 400;
  }

  .task.checked .task-note { opacity: 0.5; }

  /* subtle meta row */
  .task-meta {
    display: flex; align-items: center; gap: 10px;
    margin-top: 7px;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .task:hover .task-meta,
  .task.checked .task-meta { opacity: 1; }

  .meta-time {
    font-family: 'DM Mono', monospace;
    font-size: 10px; color: var(--ink-faint);
    letter-spacing: 0.04em;
    display: flex; align-items: center; gap: 4px;
  }

  .meta-time svg { opacity: 0.5; }

  .meta-cost {
    display: flex; align-items: center; gap: 2px;
  }

  .cost-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
  }

  .cost-dot.filled { background: var(--ink-mid); }
  .cost-dot.empty  { background: var(--rule); border: 1px solid var(--ink-faint); opacity: 0.4; }

  .meta-sep {
    width: 1px; height: 10px;
    background: var(--rule);
  }

  /* urgent pip */
  .urgent-pip {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--imp-must);
    margin-left: 6px;
    vertical-align: middle;
    animation: pulse 1.8s ease-in-out infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,0.5); }
    50%       { box-shadow: 0 0 0 4px rgba(220,38,38,0); }
  }

  /* ─── CONFETTI ─── */
  @keyframes fly {
    0%   { transform: scale(0) rotate(0deg)   translateY(0);   opacity: 1; }
    100% { transform: scale(1) rotate(600deg) translateY(-90px); opacity: 0; }
  }

  .cp {
    position: fixed;
    width: 8px; height: 8px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
    animation: fly 0.8s cubic-bezier(0.25,0.46,0.45,0.94) forwards;
  }

  /* ─── DONE BANNER ─── */
  .done-banner {
    text-align: center;
    padding: 64px 32px;
    margin-top: 48px;
    border-radius: 20px;
    background: var(--white);
    border: 1px solid var(--rule);
    display: none;
    position: relative;
    overflow: hidden;
  }

  .done-banner::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg,
      rgba(109,40,217,0.04) 0%,
      rgba(4,120,87,0.04) 50%,
      rgba(180,83,9,0.04) 100%);
  }

  .done-banner.visible { display: block; animation: fadeUp 0.5s ease; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  .done-banner h2 {
    position: relative;
    font-family: 'Playfair Display', serif;
    font-size: 40px; font-weight: 900;
    color: var(--ink);
    margin-bottom: 10px;
  }

  .done-banner p {
    position: relative;
    color: var(--ink-faint); font-size: 15px;
  }

  /* ─── FOOTER ─── */
  footer {
    text-align: center;
    padding: 32px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
    border-top: 1px solid var(--rule);
  }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 600px) {
    .hero { height: 460px; }
    .hero-content { padding: 0 24px 36px; }
    .nav { padding: 0 20px; }
    .main { padding: 40px 16px 80px; }
    .phase-num { font-size: 48px; }
    .phase-title { font-size: 18px; }
  }
</style>
</head>

      { text: "Update driver's license with new address",                   note: "Usually required within 30–60 days by state law",    imp: "high",      time: "2h",           cost: 1 },
      { text: "Update vehicle registration with new address",               note: "",                                                   imp: "high",      time: "1h",           cost: 1 },
      { text: "Register to vote at new address (if different county/state)", note: "",                                                   imp: "medium",    time: "15m",          cost: 0 },
      { text: "Notify your kids' schools (or update enrollment if needed)", note: "",                                                   imp: "high",      time: "30m",          cost: 0 },
      { text: "Transfer medical providers or notify of new address",        note: "",                                                   imp: "medium",    time: "1h",           cost: 0 },
      { text: "Update address with Social Security if applicable",          note: "",                                                   imp: "medium",    time: "30m",          cost: 0 },
      { text: "Find nearest hospital, urgent care, and pharmacy",           note: "",                                                   imp: "high",      time: "15m",          cost: 0 },
      { text: "Get to know HOA rules if applicable",                        note: "Trash days, parking, mailbox rules",                 imp: "medium",    time: "30m",          cost: 0 },
      { text: "Schedule any inspections or repairs identified at closing",  note: "",                                                   imp: "high",      time: "1h",           cost: 0 },
      { text: "Unpack systematically — kitchen and bedrooms first",         note: "",                                                   imp: "high",      time: "several days", cost: 0 },

];

// ── COST DOTS ──
function costDots(n) {
  const max = 3;
  let html = '<div class="meta-cost" title="' + ['Free','$','$$','$$$'][n] + '">';
  for (let i = 0; i < max; i++) {
    html += `<div class="cost-dot ${i < n ? 'filled' : 'empty'}"></div>`;
  }
  return html + '</div>';
}

// ── STATE ──
const KEY = 'moving-2025-v2';
let state = JSON.parse(localStorage.getItem(KEY) || '{}');
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

// ── CONFETTI ──
function burst(x, y) {
  const palette = ['#6d28d9','#be123c','#0369a1','#047857','#b45309','#f59e0b','#f97316','#e11d48'];
  for (let i = 0; i < 16; i++) {
    const el = document.createElement('div');
    el.className = 'cp';
    const a = Math.random() * Math.PI * 2;
    const r = 20 + Math.random() * 60;
    el.style.cssText = `left:${x+Math.cos(a)*r}px;top:${y+Math.sin(a)*r}px;background:${palette[Math.random()*palette.length|0]};animation-delay:${Math.random()*0.1}s`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }
}

// ── PROGRESS ──
function updateProgress() {
  let total = 0, done = 0;
  phases.forEach((p, pi) => p.tasks.forEach((_, ti) => { total++; if (state[`${pi}-${ti}`]) done++; }));
  const pct = total ? done / total : 0;
  document.getElementById('nav-fill').style.width = (pct * 100) + '%';
  document.getElementById('nav-count').textContent = done + ' / ' + total;
  const emojis = ['📦','🚛','🏗️','🔑','🏡'];
  document.getElementById('nav-emoji').textContent = emojis[Math.min(4, Math.floor(pct * 5))];
  document.getElementById('done-banner').classList.toggle('visible', done === total && total > 0);
}

// ── RENDER ──
function render() {
  const root = document.getElementById('checklist');
  root.innerHTML = '';

  phases.forEach((phase, pi) => {
    const doneCount = phase.tasks.filter((_, ti) => state[`${pi}-${ti}`]).length;
    const allDone = doneCount === phase.tasks.length;

    const section = document.createElement('div');
    section.className = 'phase';

    // header
    section.innerHTML = `
      <div class="phase-head">
        <div class="phase-num" style="color: ${allDone ? phase.color.replace('var(', '').replace(')', '') : 'var(--rule)'}; opacity: ${allDone ? '0.25' : '1'}">${phase.icon}</div>
        <div class="phase-info">
          <div class="phase-title" style="${allDone ? 'opacity:0.45' : ''}">${phase.label}</div>
          <div class="phase-sub">${phase.sub}</div>
        </div>
        <div class="phase-tally">
          <strong style="color:${doneCount > 0 ? phase.color : 'var(--ink-faint)'}">${doneCount}</strong>
          of ${phase.tasks.length}
        </div>
      </div>
      <div class="phase-rule ${doneCount > 0 ? 'active' : ''}" style="--phase-color:${phase.color}"></div>
    `;

    const list = document.createElement('div');
    list.className = 'task-list';

    phase.tasks.forEach((task, ti) => {
      const id = `${pi}-${ti}`;
      const checked = !!state[id];
      const div = document.createElement('div');
      div.className = 'task' + (checked ? ' checked' : '');
      div.dataset.imp = task.imp;

      div.innerHTML = `
        <div class="cb"></div>
        <div class="task-body">
          <div class="task-text">
            ${task.text}${task.urgent ? '<span class="urgent-pip" title="Time-sensitive"></span>' : ''}
          </div>
          ${task.note ? `<div class="task-note">${task.note}</div>` : ''}
          <div class="task-meta">
            <div class="meta-time">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
              ${task.time}
            </div>
            <div class="meta-sep"></div>
            ${costDots(task.cost)}
          </div>
        </div>
      `;

      div.addEventListener('click', () => {
        const was = !!state[id];
        state[id] = !was;
        save();
        if (!was) {
          const r = div.getBoundingClientRect();
          burst(r.left + r.width / 2, r.top + r.height / 2);
        }
        render();
        updateProgress();
      });

      list.appendChild(div);
    });

    section.appendChild(list);
    root.appendChild(section);
  });

  updateProgress();
}

render();
</script>
</body>
</html>
